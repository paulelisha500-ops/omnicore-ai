<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniCore AI</title>
    <meta
      name="description"
      content="OmniCore AI — an enterprise multimodal AI platform with a self-hosted model, a real trained churn model, cited trade-law retrieval, and every module honestly labeled live or sample."
    />
    <!-- Fonts as <link>, not a runtime CSS @import: the browser discovers them
         while parsing this file instead of after the JS bundle runs, and the
         preconnects overlap the TLS handshakes. display=swap keeps text visible
         in the fallback font if fonts.googleapis.com is slow or blocked. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: system-ui, sans-serif; max-width: 480px; margin: 15vh auto; padding: 0 20px; text-align: center; line-height: 1.6">
        <h1 style="font-size: 20px">OmniCore AI needs JavaScript</h1>
        <p>This app runs entirely in your browser. Please enable JavaScript and reload the page.</p>
        <p dir="rtl" lang="ar">يتطلب أومنيكور تفعيل جافاسكربت. فعّله ثم أعد تحميل الصفحة.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
